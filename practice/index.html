<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TOEFLPrep Complete the Words practice."><title>Practice — TOEFLPrep</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1954147280776471" crossorigin="anonymous"></script><style>:root{font-family:Arial,Helvetica,sans-serif;color:#20252f;background:#f4f4f1;line-height:1.55}*{box-sizing:border-box}body{margin:0}.bar{height:62px;background:#fbfbf9;border-bottom:1px solid #dcded9;display:flex;align-items:center;gap:24px;padding:0 22px}.bar a{color:#5658c9;text-decoration:none}.brand{font-weight:800}.side{position:fixed;left:0;top:62px;bottom:0;width:230px;background:#fbfbf9;border-right:1px solid #dddeda;padding:18px 12px}.side h2{font-size:18px;margin:0 10px 20px}.task{width:100%;border:0;background:transparent;border-radius:7px;padding:10px;text-align:left;font-weight:700;cursor:pointer}.task.active{background:#e9e9f7;color:#4f52bc}.main{margin-left:230px;padding:24px 28px;max-width:1050px}.meta{display:flex;gap:16px;align-items:center}.progress{flex:1;height:6px;background:#dedfdb;border-radius:99px}.progress i{display:block;height:100%;background:#5558c9}.timer{font-weight:800;min-width:55px;text-align:right}.panel{margin-top:18px;background:#fbfbf9;border:1px solid #dbddd8;border-radius:10px;padding:28px}.start{text-align:center;max-width:650px;margin:45px auto;padding:40px}.start h1{font:700 36px Georgia,serif}.btn{border:1px solid #cfd2d5;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#20242b;color:#fff}.passage{font-size:18px;line-height:1.95}.box{display:inline-flex;width:20px;height:28px;background:#f1f1fa;border-bottom:2px solid #5558c9;margin-left:2px;vertical-align:middle}.box input{width:100%;height:100%;border:0;background:transparent;outline:0;text-align:center;font-weight:700}.nav{display:flex;justify-content:space-between;margin-top:22px;padding-top:17px;border-top:1px solid #dedfdb}.ad{margin-top:24px;min-height:90px}.foot{margin-left:230px;padding:30px 28px;color:#777}.foot a{color:#5658c9}@media(max-width:700px){.side{position:static;width:auto;border-right:0;border-bottom:1px solid #dddeda;padding:10px;display:flex;gap:5px;overflow:auto}.side h2{display:none}.task{white-space:nowrap;width:auto}.main{margin:0;padding:16px}.foot{margin:0}.panel{padding:18px}.passage{font-size:16px}}</style></head><body><header class="bar"><a href="../">← Home</a><div class="brand">TOEFLPrep</div><span>Complete the Words</span></header><aside class="side"><h2>Complete the Words</h2><button class="task active" data-task="0">Task 1</button><button class="task" data-task="1">Task 2</button><button class="task" data-task="2">Task 3</button><button class="task" data-task="3">Task 4</button><button class="task" data-task="4">Task 5</button><button class="task" data-task="5">Task 6</button><button class="task" data-task="6">Task 7</button><button class="task" data-task="7">Task 8</button><button class="task" data-task="8">Task 9</button><button class="task" data-task="9">Task 10</button><button class="task" data-task="10">Task 11</button><button class="task" data-task="11">Task 12</button><button class="task" data-task="12">Task 13</button><button class="task" data-task="13">Task 14</button><button class="task" data-task="14">Task 15</button><button class="task" data-task="15">Task 16</button><button class="task" data-task="16">Task 17</button><button class="task" data-task="17">Task 18</button><button class="task" data-task="18">Task 19</button><button class="task" data-task="19">Task 20</button></aside><main class="main"><div class="meta"><div class="progress"><i id="prog" style="width:0%"></i></div><div id="timer">—:——</div></div><div class="panel" id="panel"></div><div class="ad"><ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1954147280776471" data-ad-slot="5455920899" data-ad-format="auto" data-full-width-responsive="true"></ins></div></main><footer class="foot"><a href="../privacy.html">Privacy Policy</a> · <a href="mailto:heyarsen@icloud.com">heyarsen@icloud.com</a></footer><script>const TASK_TIME=150,$=id=>document.getElementById(id);let current=0,timer=null,state=null;const data=[
{topic:'Wetland ecosystems',words:['filter','provide','store','loss','monitor','focus','help','support','flood','restore'],text:'Wetlands can filter water by trapping sediments and pollutants before they reach rivers. They also provide habitat for many species, especially during seasonal migrations. Wetland soils can store large amounts of carbon. When wetlands are drained, the loss of vegetation can increase erosion and reduce water quality. Researchers monitor changes in wetland areas to understand their ecological value. Restoration projects focus on returning natural water flows and replanting native vegetation. These efforts may help wetlands recover their capacity to support wildlife and protect communities from flood damage.'},
{topic:'Agriculture',words:['domesticated','remain','growth','reconstruct','develop','regions','adapted','drier','irrigation','study'],text:'Early farmers gradually domesticated plants and animals, making food supplies more predictable. This allowed some communities to remain in one place. Permanent settlements encouraged the growth of trade and specialized occupations. Archaeologists examine seeds, tools, and building remains to reconstruct these changes. They compare evidence from different regions because agriculture did not develop in exactly the same way everywhere. In some areas, farmers adapted crops to drier conditions, while elsewhere they relied on irrigation. Researchers continue to study how these choices changed societies over time.'},
{topic:'Sleep and memory',words:['reorganize','important','help','learn','reveal','develop','improve','examine','memory','attention'],text:'During sleep, the brain appears to reorganize information acquired during the day. Researchers have found that certain stages are especially important for consolidating memories. Deep sleep may help stabilize newly learned material. Sleep also influences attention, which can affect how effectively people learn. Studies often reveal that reducing sleep can impair concentration. Scientists recommend that students develop regular sleep schedules. Adequate rest may also improve problem solving and mood. Researchers continue to examine why sleep affects different types of memory and attention.'},
{topic:'Urban heat islands',words:['absorb','vegetation','study','reflect','reduce','local','monitor','climate','improve','parks'],text:'Buildings and paved surfaces absorb solar energy during the day and release it slowly after sunset. A shortage of vegetation can make the urban heat island effect more pronounced. Urban planners study ways to increase tree cover and create parks. Some cities test lighter roofing materials that reflect more sunlight. These strategies can reduce local temperatures and improve comfort during heat waves. The best solutions depend on local climate and building design. Researchers also monitor temperature changes to measure results.'},
{topic:'Volcanic activity',words:['expand','detect','help','reveal','single','improve','study','chemical','measure','activity'],text:'When magma rises toward the surface, dissolved gases can expand and contribute to explosive activity. Scientists use instruments that detect earthquakes, ground deformation, and changes in gas emissions. These measurements can help estimate whether an eruption is becoming more likely. Historical records can reveal patterns of activity. Scientists combine several types of information rather than relying on a single measurement. The goal is to improve warnings and help communities prepare. Researchers study the chemical composition of volcanic gases and measure changes in activity.'}
];
while(data.length<20){const base=data[(data.length-5)%5];data.push({topic:base.topic+' — Set '+(data.length-4),words:[...base.words],text:base.text})}
function ads(){window.adsbygoogle=window.adsbygoogle||[];document.querySelectorAll('.adsbygoogle:not([data-pushed])').forEach(e=>{e.dataset.pushed='1';try{adsbygoogle.push({})}catch{}})}function miss(w){return Math.ceil(w.length/2)}function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(){state={answers:Array(10).fill(''),started:Date.now()};render();clearInterval(timer);timer=setInterval(tick,250)}function render(){const t=data[current];$('panel').innerHTML=`<div class="start"><div style="text-transform:uppercase;letter-spacing:.08em;color:#5558c9;font-size:12px;font-weight:800">Task ${current+1}</div><h1>${escape(t.topic)}</h1><p>This is an original TOEFL-style practice passage. It uses the 2026 Complete the Words structure. Start when you are ready; the 2:30 timer begins only after starting.</p><p><b>10 incomplete words</b> · <b>2:30</b></p><button class="btn" id="go">Start task</button></div>`;document.querySelectorAll('.task').forEach((b,i)=>b.classList.toggle('active',i===current));$('timer').textContent='—:——';$('prog').style.width='0%';$('go').onclick=showTask}function showTask(){const t=data[current];const seen={};let html=t.text.replace(/\b[A-Za-z]+\b/g,w=>{const i=t.words.indexOf(w);if(i<0)return escape(w);const n=miss(w),keep=w.length-n;seen[i]=true;let h='';for(let p=keep;p<w.length;p++)h+=`<span class="box"><input maxlength="1" data-i="${i}" aria-label="Missing letter"></span>`;return `<span>${escape(w.slice(0,keep))}${h}</span>`});$('panel').innerHTML=`<div class="passage">${html}</div><div class="nav"><span>Task ${current+1} · 10 incomplete words</span><button class="btn" id="finish">Finish task</button></div>`;const inputs=[...document.querySelectorAll('input[data-i]')];inputs.forEach((x,i)=>{x.addEventListener('input',()=>{if(x.value&&inputs[i+1])inputs[i+1].focus()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value)inputs[i-1]?.focus()})});inputs[0]?.focus();$('finish').onclick=finish}function tick(){const left=Math.max(0,TASK_TIME-Math.floor((Date.now()-state.started)/1000));$('timer').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('prog').style.width=((TASK_TIME-left)/TASK_TIME*100)+'%';if(left<=0)finish()}function finish(){clearInterval(timer);const t=data[current],inputs=[...document.querySelectorAll('input[data-i]')];const values=Array(t.words.length).fill('').map(()=>[]);inputs.forEach(x=>values[+x.dataset.i].push(x.value||''));let correct=0,total=0;const rows=t.words.map((w,i)=>{const n=miss(w),expected=w.slice(w.length-n),ans=(values[i]||[]).join('');total+=n;if(ans.toLowerCase()===expected.toLowerCase())correct+=n;return `<div style="padding:13px 0;border-top:1px solid #ddd">Word ${i+1}: <b>${escape(w)}</b><br>Your answer: ${escape(ans||'—')} · Correct: ${escape(expected)}</div>`}).join('');$('panel').innerHTML=`<div><div style="font-size:12px;color:#5558c9;font-weight:800;text-transform:uppercase">Task complete</div><h1>Result</h1><p><b>${correct}/${total}</b> missing letters correct · <b>${Math.round(correct/total*100)}%</b> accuracy</p><div>${rows}</div><button class="btn" id="again">Try again</button></div>`;$('again').onclick=start;$('timer').textContent='Done';ads()}document.querySelectorAll('.task').forEach((b,i)=>b.onclick=()=>{current=i;start()});start();ads();</script></body></html>
