<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Focused TOEFL Complete the Words practice."><meta name="theme-color" content="#f6f1e8"><title>Practice · TOEFLPrep</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1954147280776471" crossorigin="anonymous"></script><style>:root{--paper:#f6f1e8;--white:#fffdf8;--ink:#171b22;--muted:#6f757d;--line:#d7d0c4;--accent:#d94a32;--accent-dark:#a83f2b;--dark:#1d252b;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}body{min-height:100vh}.header{height:66px;position:sticky;top:0;z-index:100;background:rgba(246,241,232,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:26px}.logo{font:800 19px var(--sans);letter-spacing:-.04em;color:var(--ink);text-decoration:none}.logo b{color:var(--accent)}.header-title{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:18px}.header-right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px}.header-right a{color:var(--ink);text-decoration:none}.header-right a:hover{color:var(--accent-dark)}.layout{display:grid;grid-template-columns:220px minmax(0,920px);max-width:1220px;margin:0 auto;min-height:calc(100vh - 66px)}.side{position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto;border-right:1px solid var(--line);padding:24px 15px 30px}.side-label{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);padding:0 8px 10px}.task{display:flex;width:100%;height:36px;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid transparent;padding:0 8px;color:#5d666d;text-align:left;cursor:pointer;font:600 13px var(--sans)}.task:hover{color:var(--ink);background:#eee8de}.task.active{color:var(--ink);background:var(--white);border-color:var(--line)}.task-num{font-size:10px;color:var(--muted);width:22px}.task.active .task-num{color:var(--accent);font-weight:800}.main{padding:0 34px 50px}.bar{position:sticky;top:66px;z-index:80;background:var(--paper);padding:15px 0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}.bar-line{height:3px;background:#ddd5c9;flex:1}.bar-line i{display:block;height:100%;background:var(--accent);width:0}.clock{font:700 16px var(--sans);min-width:50px;text-align:right}.heading{padding:22px 0 17px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);font-weight:800}.heading h1{font:700 31px/1.05 var(--serif);margin:6px 0}.heading p{font-size:13px;color:var(--muted);margin:0}.surface{background:var(--white);border:1px solid var(--line)}.intro{padding:34px;max-width:760px}.intro h2{font:700 28px var(--serif);margin:6px 0 10px}.intro p{color:#5f686e;line-height:1.65;max-width:620px}.facts{display:flex;gap:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:22px 0}.facts strong{display:block;font-size:17px}.facts span{font-size:11px;color:var(--muted)}button.start,button.finish{border:0;background:var(--dark);color:#fff;padding:11px 18px;font-weight:800;font-size:13px;cursor:pointer}button.start:hover,button.finish:hover{background:var(--accent-dark)}.ready-note{font-size:11px;color:var(--muted);margin-left:12px}.passage{padding:40px 44px;font:18px/1.9 var(--serif);max-width:920px}.word{white-space:nowrap}.blank{display:inline-flex;width:20px;height:27px;border-bottom:2px solid var(--accent);margin-left:2px;vertical-align:middle;background:#f0e9df}.blank input{width:100%;height:100%;border:0;background:transparent;text-align:center;outline:0;font:700 15px var(--sans);text-transform:lowercase}.blank input:focus{background:#eaded4}.controls{border-top:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.ad{min-height:90px;display:flex;align-items:center;justify-content:center;padding:14px 0}.results{padding:34px}.results h2{font:700 34px var(--serif);margin:4px 0}.score{font-size:50px;font-weight:800;margin:12px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stat{padding:17px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.review{margin-top:25px}.review h3{font:700 22px var(--serif)}.review-row{padding:12px 0;border-top:1px solid var(--line)}.good{color:#28734a}.bad{color:#9c4b4b}.footer{max-width:1220px;margin:auto;border-top:1px solid var(--line);padding:22px 28px 34px;font-size:12px;color:var(--muted)}.footer a{color:var(--ink);text-decoration:none}.footer a:hover{color:var(--accent-dark)}@media(max-width:760px){.header{height:58px;padding:0 15px;gap:12px}.header-title{display:none}.layout{display:block;min-height:0}.side{position:sticky;top:58px;height:auto;max-height:118px;z-index:90;border-right:0;border-bottom:1px solid var(--line);padding:7px 10px;display:flex;gap:3px;overflow-x:auto;background:var(--paper)}.side-label{display:none}.task{width:auto;min-width:68px;height:40px;padding:0 9px}.task-num{display:none}.main{padding:0 13px 35px}.bar{top:176px}.heading{padding:19px 0 13px}.heading h1{font-size:28px}.intro{padding:25px 20px}.facts{gap:18px;flex-wrap:wrap}.ready-note{display:block;margin:9px 0 0}.passage{padding:25px 19px;font-size:16px;line-height:1.85}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}}}</style></head><body><header class="header"><a class="logo" href="../">TOEFL<b>Prep</b></a><div class="header-title">Complete the Words</div><div class="header-right"><span id="headerTask">Task 01</span><a href="../">Home</a></div></header><div class="layout"><aside class="side"><div class="side-label">Complete the Words</div><div id="tasks"></div></aside><main class="main"><div class="bar"><div class="bar-line"><i id="progress"></i></div><div class="clock" id="clock">—:——</div></div><div class="heading"><div class="kicker" id="kicker">Task 01</div><h1>Complete the Words</h1><p id="meta">Choose a task, then start when you are ready.</p></div><div id="app"></div><div class="ad"><ins class="adsbygoogle" style="display:block;width:100%;min-height:90px" data-ad-client="ca-pub-1954147280776471" data-ad-slot="5455920899" data-ad-format="auto" data-full-width-responsive="true"></ins></div></main></div><footer class="footer">TOEFLPrep · Free TOEFL practice · <a href="../privacy.html">Privacy Policy</a> · <a href="mailto:heyarsen@icloud.com">heyarsen@icloud.com</a></footer><script>
const TIME=150;let current=0,started=false,startAt=0,timer=null;const $=id=>document.getElementById(id);
const sets=[['Wetland ecosystems','Wetlands can filter water by trapping sediments and pollutants before they reach rivers. They also provide habitat for many species, especially during seasonal migrations. Wetland soils can store large amounts of carbon. When wetlands are drained, the loss of vegetation can increase erosion and reduce water quality. Researchers monitor changes in wetland areas to understand their ecological value. Restoration projects focus on returning natural water flows and replanting native vegetation.'],['Agriculture','Early farmers gradually domesticated plants and animals, making food supplies more predictable. This allowed some communities to remain in one place. Permanent settlements encouraged the growth of trade and specialized occupations. Archaeologists examine seeds, tools, and building remains to reconstruct these changes. They compare evidence from different regions because agriculture did not develop in exactly the same way everywhere. Some farmers adapted crops to drier conditions, while others relied on irrigation.'],['Sleep and memory','During sleep, the brain appears to reorganize information acquired during the day. Researchers have found that certain stages are especially important for consolidating memories. Deep sleep may help stabilize newly learned material. Sleep also influences attention and can affect how effectively people learn. Studies often reveal that reducing sleep can impair concentration. Scientists recommend that students develop regular sleep schedules. Adequate rest may also improve problem solving and mood.'],['Urban heat islands','Buildings and paved surfaces absorb solar energy during the day and release it slowly after sunset. A shortage of vegetation can make the urban heat island effect more pronounced. Urban planners study ways to increase tree cover and create parks. Some cities test lighter roofing materials that reflect more sunlight. These strategies can reduce local temperatures and improve comfort during heat waves. Researchers also monitor temperature changes to measure results.'],['Volcanic activity','When magma rises toward the surface, dissolved gases can expand and contribute to explosive activity. Scientists use instruments that detect earthquakes, ground deformation, and changes in gas emissions. These measurements can help estimate whether an eruption is becoming more likely. Historical records can reveal patterns of activity. Scientists combine several types of information rather than relying on a single measurement. The goal is to improve warnings and help communities prepare.'],['Ocean ecosystems','Near the surface of the ocean, microscopic algae produce oxygen and form the base of many food webs. These organisms are a major food source for small animals. In deeper water, conditions are colder and darker, so organisms adapt in different ways. Scientists monitor temperature and chemistry to reveal changes caused by currents or pollution. Understanding these patterns helps researchers predict how marine communities may respond to climate change.'],['Libraries','Many libraries now offer electronic books, databases, and online research tools. These resources allow students to access information from many locations. Physical libraries remain important places for study and collaboration. Librarians help students evaluate sources and develop efficient research strategies. Some institutions have created media labs and collaborative workspaces. Researchers continue to explore how library services should adapt as learning habits change.'],['Animal migration','Animal migration is influenced by seasonal changes in food, temperature, and daylight. Some species travel thousands of kilometers between breeding and feeding areas. Scientists track animals with small devices that record movement and location. These data can reveal routes that were previously unknown. Migration timing can change when climate conditions shift. Researchers are interested in how these changes may impact population survival.'],['Printing history','Early printing methods made texts more available to a wider audience. As books became less expensive, literacy increased in many societies. Printed materials allowed scientists to share observations more easily. Over time, publishers developed new ways to reach readers. Historians study old documents to understand how information circulated. Modern digital publishing has accelerated this process, allowing people to distribute material almost instantly.'],['Soils','Soils are complex systems that support plants and influence water movement. Different soils contain varying amounts of sand, clay, and organic material. These differences affect how quickly water can penetrate the ground. Soil organisms decompose organic matter and release nutrients. Farmers may test soil to determine which crops are most suitable. Conservation practices can reduce erosion and maintain fertility.'],['Astronomy','Light collected by a telescope can reveal information about a star’s temperature and composition. Spectrographs separate light into wavelengths, allowing scientists to determine which elements are present. Astronomers also monitor changes in brightness that may indicate orbiting planets. These observations help researchers understand how planetary systems form.'],['Forests','Forests influence climate by storing carbon and moving water through ecosystems. Trees absorb carbon dioxide during photosynthesis and release water vapor. Researchers use satellites to monitor forest cover and identify areas at risk of deforestation. Conservation programs can protect habitats while sustainable forestry can reduce pressure on remaining forests.'],['Architecture','Architecture reflects the materials and technologies available to a society. Builders in different regions developed styles that responded to climate and local resources. Modern architects increasingly combine energy efficiency with attractive design. They may include shading systems, natural ventilation, and recycled materials.'],['Language learning','Learning a new language requires regular exposure and active use. Learners often remember vocabulary more effectively when they use words in meaningful contexts. Speaking practice can improve confidence. Teachers may design tasks that require learners to solve problems using the target language.'],['Plant adaptation','Plants respond to changes in light, temperature, and water. Some species store water in specialized tissues. Others develop deep roots that reach underground sources. Researchers study these adaptations to understand how plants survive in difficult environments.'],['Rivers','Rivers shape landscapes by transporting sediment from one place to another. Fast water can erode rock and soil, while slower water allows sediment to deposit. Over long periods, these processes can create valleys and floodplains. Scientists study river systems to understand how landscapes change.'],['Museums','Museums preserve objects that help people learn about past societies. Curators carefully control temperature and humidity because delicate materials can deteriorate. Digital archives can also provide access to collections. Museums increasingly use interactive displays to help visitors understand historical context.'],['Public transportation','Public transportation can reduce congestion when it is frequent and reliable. Buses and trains allow many people to travel using less road space. Cities may invest in dedicated lanes and modern stations. Planners study passenger patterns to improve routes and service.'],['Nutrition','A balanced diet provides energy and essential nutrients. Researchers study how eating patterns may influence long-term health. Nutrition advice can change as new evidence becomes available. Scientists therefore evaluate dietary studies carefully before making recommendations.'],['Renewable energy','Solar panels convert sunlight into electricity, while wind turbines generate power from moving air. Storage systems can help balance supply when renewable generation changes. Engineers continue to improve efficiency and reduce costs as energy systems become more diverse.']];
const data=sets.map(s=>({topic:s[0],text:s[1],words:[...new Set((s[1].match(/\b[A-Za-z]{5,}\b/g)||[]))].slice(0,10)}));
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function miss(w){return Math.ceil(w.length/2)}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function initAds(){window.adsbygoogle=window.adsbygoogle||[];document.querySelectorAll('.adsbygoogle:not([data-pushed])').forEach(e=>{e.dataset.pushed='1';try{window.adsbygoogle.push({})}catch{}})}
function renderTasks(){const box=$('tasks');box.innerHTML=data.map((_,i)=>`<button class="task" data-i="${i}"><span class="task-num">${String(i+1).padStart(2,'0')}</span>Task ${i+1}</button>`).join('');box.querySelectorAll('.task').forEach(b=>b.onclick=()=>selectTask(+b.dataset.i))}
function selectTask(i){clearInterval(timer);timer=null;current=i;started=false;$('clock').textContent='—:——';$('progress').style.width='0%';$('headerTask').textContent=`Task ${String(i+1).padStart(2,'0')}`;$('kicker').textContent=`Task ${String(i+1).padStart(2,'0')} · ${data[i].topic}`;$('meta').textContent='Choose a task, then start when you are ready.';document.querySelectorAll('.task').forEach((b,n)=>b.classList.toggle('active',n===i));renderReady()}
function renderReady(){const d=data[current];$('app').innerHTML=`<section class="surface intro"><div class="kicker">${esc(d.topic)}</div><h2>Complete the Words</h2><p>Read the paragraph and enter the missing letters in each incomplete word. The timer starts only when you choose to begin.</p><div class="facts"><div><strong>2:30</strong><span>time limit</span></div><div><strong>10</strong><span>incomplete words</span></div><div><strong>1</strong><span>paragraph</span></div></div><button class="start" id="start">Start Task</button><span class="ready-note">Nothing starts until you press the button.</span></section>`;$('start').onclick=startTask}
function startTask(){if(started)return;started=true;startAt=Date.now();renderQuestion();tick();clearInterval(timer);timer=setInterval(tick,250)}
function renderQuestion(){const d=data[current];const re=new RegExp('\\b('+d.words.map(w=>w.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')).join('|')+')\\b','g');const html=d.text.replace(re,w=>{const i=d.words.indexOf(w),n=miss(w),keep=w.length-n;let h='';for(let j=0;j<n;j++)h+=`<span class="blank"><input maxlength="1" data-i="${i}" data-j="${j}" aria-label="Missing letter"></span>`;return `<span class="word">${esc(w.slice(0,keep))}${h}</span>`});$('meta').textContent='In progress · 10 incomplete words';$('app').innerHTML=`<section class="surface"><div class="passage">${html}</div><div class="controls"><span>Task ${current+1} · 10 incomplete words</span><button class="finish" id="finish">Finish Task</button></div></section>`;const inputs=[...document.querySelectorAll('.blank input')];inputs.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/[^a-z]/gi,'').slice(-1).toLowerCase();if(x.value)inputs[i+1]?.focus()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value){e.preventDefault();inputs[i-1]?.focus()}})});inputs[0]?.focus();$('finish').onclick=()=>finish(false)}
function tick(){if(!started)return;const left=Math.max(0,TIME-Math.floor((Date.now()-startAt)/1000));$('clock').textContent=fmt(left);$('progress').style.width=((TIME-left)/TIME*100)+'%';if(left<=0)finish(true)}
function finish(expired){clearInterval(timer);timer=null;if(!started)return;const d=data[current],inputs=[...document.querySelectorAll('.blank input')];let correct=0,total=0;const by=Array(10).fill('').map(()=>[]);inputs.forEach(x=>by[+x.dataset.i][+x.dataset.j]=x.value||'');const rows=d.words.map((w,i)=>{const n=miss(w),expected=w.slice(w.length-n),ans=(by[i]||[]).join('');total+=n;const ok=ans.toLowerCase()===expected.toLowerCase();if(ok)correct+=n;return `<div class="review-row"><b>Word ${i+1}: ${esc(w)}</b><div class="${ok?'good':'bad'}">Your answer: ${esc(ans||'—')}${ok?'':' · Correct: '+esc(expected)}</div></div>`}).join('');$('app').innerHTML=`<section class="surface results"><div class="kicker">Task ${String(current+1).padStart(2,'0')} · complete</div><h2>Result</h2><div class="score">${Math.round(correct/total*100)}%</div><div class="stats"><div class="stat"><b>${correct}</b><span>Correct letters</span></div><div class="stat"><b>${total-correct}</b><span>Incorrect letters</span></div><div class="stat"><b>${fmt(Math.min(TIME,Math.floor((Date.now()-startAt)/1000)))}</b><span>Time</span></div></div><div class="review"><h3>Review</h3>${rows}</div><button class="start" id="again">Try Again</button></section>`;$('again').onclick=()=>{started=false;selectTask(current)}}
renderTasks();selectTask(0);initAds();
</script></body></html>
