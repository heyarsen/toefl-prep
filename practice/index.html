<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free TOEFL 2026 Complete the Words practice."><title>Practice — TOEFLPrep</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1954147280776471" crossorigin="anonymous"></script><style>:root{font-family:Arial,Helvetica,sans-serif;color:#222831;background:#f7f7f5;line-height:1.55}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#fff;border-bottom:1px solid #d8dbd7;display:flex;align-items:center;padding:0 22px;gap:18px}.top a{color:#5658c9;text-decoration:none;font-size:14px}.brand{font-weight:800}.tag{color:#777f85;font-size:13px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}.sidebar{background:#fff;border-right:1px solid #d8dbd7;padding:14px 10px;overflow:auto}.sidebar-head{padding:4px 9px 12px;border-bottom:1px solid #eceeea;margin-bottom:7px}.sidebar-head strong{font-size:14px}.sidebar-head small{display:block;color:#7e858c;font-size:11px;margin-top:3px}.task{width:100%;height:34px;border:0;background:transparent;border-radius:5px;padding:0 8px;display:flex;align-items:center;gap:9px;font:600 13px Arial;color:#5a626b;text-align:left;cursor:pointer}.task:hover{background:#f1f2ef}.task.active{background:#ececf7;color:#4548af}.task .num{width:23px;height:23px;background:#eef0ec;border-radius:4px;display:grid;place-items:center;font-size:10px}.task.active .num{background:#dcdcf0}.content{max-width:980px;width:100%;padding:20px 28px 30px}.status{display:flex;align-items:center;gap:14px}.progress{height:5px;flex:1;background:#dedfdb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#5658c9}.timer{min-width:58px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 0 12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5658c9;font-weight:800}.heading h1{font:700 26px Georgia,serif;margin:4px 0 0}.heading p{margin:3px 0 0;color:#737a82;font-size:13px}.panel{background:#fff;border:1px solid #d8dbd7;border-radius:7px;overflow:hidden}.ready{padding:34px}.ready h2{font:700 30px Georgia,serif;margin:5px 0 8px}.ready p{max-width:650px;color:#626b73}.facts{display:flex;gap:30px;margin:20px 0;color:#6d757c;font-size:12px}.facts b{display:block;color:#222831;font-size:16px}.start-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #c6c9c5;border-radius:6px;background:#22262c;color:#fff;padding:10px 14px;font:700 13px Arial;cursor:pointer}.btn.secondary{background:#fff;color:#22262c}.note{font-size:12px;color:#777f85}.passage{padding:28px;font-size:18px;line-height:1.95}.word{white-space:nowrap}.box{display:inline-flex;width:20px;height:27px;background:#f1f1fa;border-bottom:2px solid #5658c9;margin-left:2px;vertical-align:middle}.box input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;font-weight:700;font-size:15px}.box input:focus{background:#e4e4f3}.nav{border-top:1px solid #dedfdb;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;color:#6d757c;font-size:12px}.ad{min-height:90px;display:flex;align-items:center;justify-content:center;padding:10px}.footer{border-top:1px solid #d8dbd7;padding:18px 22px;color:#777f85;font-size:13px;background:#f7f7f5}.footer a{color:#5658c9}.results{padding:28px}.results h2{font:700 32px Georgia,serif;margin:5px 0}.score{font-size:48px;font-weight:800;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.stat{background:#f1f2ef;border:1px solid #ddd;padding:13px;border-radius:7px}.stat strong{display:block;font-size:20px}.review{margin-top:18px}.review-row{border-top:1px solid #dedfdb;padding:12px 0}.good{color:#28734a}.bad{color:#9c4b4b}.mobile-taskbar{display:none}@media(max-width:760px){.layout{display:block}.sidebar{display:block;border-right:0;border-bottom:1px solid #d8dbd7;max-height:150px}.sidebar-head{display:none}.task{display:inline-flex;width:74px;margin:0 2px}.task .num{display:none}.content{padding:15px 12px 25px}.heading{display:block}.facts{gap:18px;flex-wrap:wrap}.ready{padding:24px 18px}.passage{padding:20px;font-size:16px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><a href="../">← Home</a><div class="brand">TOEFLPrep</div><div class="tag">Complete the Words</div></header><div class="layout"><aside class="sidebar"><div class="sidebar-head"><strong>Complete the Words</strong><small>Practice set 1–20</small></div><button class="task active" data-task="0"><span class="num">01</span>Task 1</button><button class="task" data-task="1"><span class="num">02</span>Task 2</button><button class="task" data-task="2"><span class="num">03</span>Task 3</button><button class="task" data-task="3"><span class="num">04</span>Task 4</button><button class="task" data-task="4"><span class="num">05</span>Task 5</button><button class="task" data-task="5"><span class="num">06</span>Task 6</button><button class="task" data-task="6"><span class="num">07</span>Task 7</button><button class="task" data-task="7"><span class="num">08</span>Task 8</button><button class="task" data-task="8"><span class="num">09</span>Task 9</button><button class="task" data-task="9"><span class="num">10</span>Task 10</button><button class="task" data-task="10"><span class="num">11</span>Task 11</button><button class="task" data-task="11"><span class="num">12</span>Task 12</button><button class="task" data-task="12"><span class="num">13</span>Task 13</button><button class="task" data-task="13"><span class="num">14</span>Task 14</button><button class="task" data-task="14"><span class="num">15</span>Task 15</button><button class="task" data-task="15"><span class="num">16</span>Task 16</button><button class="task" data-task="16"><span class="num">17</span>Task 17</button><button class="task" data-task="17"><span class="num">18</span>Task 18</button><button class="task" data-task="18"><span class="num">19</span>Task 19</button><button class="task" data-task="19"><span class="num">20</span>Task 20</button></aside><main class="content"><div class="status"><div class="progress"><i id="progress" style="width:0%"></i></div><div class="timer" id="timer">—:——</div></div><div class="heading"><div><div class="eyebrow" id="taskId">Task 01</div><h1>Complete the Words</h1><p id="meta">Ready to start · 10 incomplete words · 2:30</p></div></div><div class="panel" id="panel"></div><div class="ad"><ins class="adsbygoogle" style="display:block;width:100%;min-height:90px" data-ad-client="ca-pub-1954147280776471" data-ad-slot="5455920899" data-ad-format="auto" data-full-width-responsive="true"></ins></div></main></div><footer class="footer">TOEFLPrep · Free TOEFL practice · <a href="../privacy.html">Privacy Policy</a> · <a href="mailto:heyarsen@icloud.com">heyarsen@icloud.com</a></footer><script>
const TIME=150,$=id=>document.getElementById(id);let current=0,timer=null,state=null;
const seeds=[{topic:'Wetland ecosystems',words:['filter','provide','store','loss','monitor','focus','help','support','flood','restore'],text:'Wetlands can filter water by trapping sediments and pollutants before they reach rivers. They also provide habitat for many species, especially during seasonal migrations. Wetland soils can store large amounts of carbon. When wetlands are drained, the loss of vegetation can increase erosion and reduce water quality. Researchers monitor changes in wetland areas to understand their ecological value. Restoration projects focus on returning natural water flows and replanting native vegetation. These efforts may help wetlands recover their capacity to support wildlife and protect communities from flood damage.'},{topic:'Agriculture',words:['domesticated','remain','growth','reconstruct','develop','regions','adapted','drier','irrigation','study'],text:'Early farmers gradually domesticated plants and animals, making food supplies more predictable. This allowed some communities to remain in one place. Permanent settlements encouraged the growth of trade and specialized occupations. Archaeologists examine seeds, tools, and building remains to reconstruct these changes. They compare evidence from different regions because agriculture did not develop in exactly the same way everywhere. Some farmers adapted crops to drier conditions, while others relied on irrigation. Researchers continue to study how these choices changed societies over time.'},{topic:'Sleep and memory',words:['reorganize','important','help','learn','reveal','develop','improve','examine','memory','attention'],text:'During sleep, the brain appears to reorganize information acquired during the day. Researchers have found that certain stages are especially important for consolidating memories. Deep sleep may help stabilize newly learned material. Sleep also influences attention and can affect how effectively people learn. Studies often reveal that reducing sleep can impair concentration. Scientists recommend that students develop regular sleep schedules. Adequate rest may also improve problem solving and mood. Researchers continue to examine why sleep affects different types of memory and attention.'},{topic:'Urban heat islands',words:['absorb','vegetation','study','reflect','reduce','local','monitor','climate','improve','parks'],text:'Buildings and paved surfaces absorb solar energy during the day and release it slowly after sunset. A shortage of vegetation can make the urban heat island effect more pronounced. Urban planners study ways to increase tree cover and create parks. Some cities test lighter roofing materials that reflect more sunlight. These strategies can reduce local temperatures and improve comfort during heat waves. The best solutions depend on local climate and building design. Researchers also monitor temperature changes to measure results.'},{topic:'Volcanic activity',words:['expand','detect','help','reveal','single','improve','study','chemical','measure','activity'],text:'When magma rises toward the surface, dissolved gases can expand and contribute to explosive activity. Scientists use instruments that detect earthquakes, ground deformation, and changes in gas emissions. These measurements can help estimate whether an eruption is becoming more likely. Historical records can reveal patterns of activity. Scientists combine several types of information rather than relying on a single measurement. The goal is to improve warnings and help communities prepare. Researchers study the chemical composition of volcanic gases and measure changes in activity.'}];
const data=Array.from({length:20},(_,i)=>{const b=seeds[i%seeds.length];return{topic:b.topic+(i>=5?' · Practice Set '+(i+1):''),words:[...b.words],text:b.text}});
function ads(){window.adsbygoogle=window.adsbygoogle||[];document.querySelectorAll('.adsbygoogle:not([data-pushed])').forEach(e=>{e.dataset.pushed='1';try{window.adsbygoogle.push({})}catch{}})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function miss(w){return Math.ceil(w.length/2)}function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function selectTask(i){current=i;clearInterval(timer);timer=null;state=null;document.querySelectorAll('.task').forEach((b,j)=>b.classList.toggle('active',j===current));renderReady()}
function renderReady(){const t=data[current];$('timer').textContent='—:——';$('progress').style.width='0%';$('taskId').textContent=`Task ${String(current+1).padStart(2,'0')}`;$('meta').textContent='Ready to start · 10 incomplete words · 2:30';$('panel').innerHTML=`<div class="ready"><div class="eyebrow">${esc(t.topic)}</div><h2>Start this practice set</h2><p>Read the paragraph and complete the missing letters. Selecting a task does not start the timer.</p><div class="facts"><span><b>2:30</b>time limit</span><span><b>10</b>incomplete words</span><span><b>1</b>paragraph</span></div><div class="start-actions"><button class="btn" id="startTask">Start task</button><span class="note">The timer starts only after you click.</span></div></div>`;$('startTask').onclick=startTask}
function startTask(){if(state?.started)return;state={started:true,startAt:Date.now(),answers:Array(10).fill(null).map(()=>[])};renderQuestion();tick();clearInterval(timer);timer=setInterval(tick,250)}
function renderQuestion(){const t=data[current];const re=new RegExp('\\b('+t.words.map(w=>w.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')).join('|')+')\\b','g');const html=t.text.replace(re,w=>{const i=t.words.indexOf(w),n=miss(w),keep=w.length-n;let h='';for(let j=0;j<n;j++)h+=`<span class="box"><input maxlength="1" data-i="${i}" data-j="${j}" aria-label="Missing letter"></span>`;return `<span class="word">${esc(w.slice(0,keep))}${h}</span>`});$('panel').innerHTML=`<div class="passage">${html}</div><div class="nav"><span>Task ${current+1} · 10 incomplete words</span><button class="btn secondary" id="finish">Finish task</button></div>`;const ins=[...document.querySelectorAll('.box input')];ins.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/[^a-z]/gi,'').slice(-1).toLowerCase();state.answers[+x.dataset.i][+x.dataset.j]=x.value;if(x.value)ins[i+1]?.focus()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value){e.preventDefault();ins[i-1]?.focus()}})});ins[0]?.focus();$('finish').onclick=()=>finish(false)}
function tick(){if(!state?.started)return;const left=Math.max(0,TIME-Math.floor((Date.now()-state.startAt)/1000));$('timer').textContent=fmt(left);$('progress').style.width=((TIME-left)/TIME*100)+'%';if(left<=0)finish(true)}
function finish(expired){clearInterval(timer);timer=null;if(!state?.started)return;const t=data[current];let correct=0,total=0,answered=0;const rows=t.words.map((w,i)=>{const n=miss(w),expected=w.slice(w.length-n),ans=(state.answers[i]||[]).join('');total+=n;if(ans)answered++;const ok=ans.toLowerCase()===expected.toLowerCase();if(ok)correct+=n;return `<div class="review-row"><b>Word ${i+1}: ${esc(w)}</b><div class="${ok?'good':'bad'}">Your answer: ${esc(ans||'—')}${ok?'':' · Correct: '+esc(expected)}</div></div>`}).join('');$('meta').textContent='Task complete';$('taskId').textContent=`Task ${String(current+1).padStart(2,'0')}`;$('panel').innerHTML=`<div class="results"><div class="eyebrow">${expired?'Time expired':'Task complete'}</div><h2>Result</h2><div class="score">${Math.round(correct/total*100)}%</div><div class="stats"><div class="stat">Correct<strong>${correct}</strong></div><div class="stat">Incorrect<strong>${total-correct}</strong></div><div class="stat">Answered<strong>${answered}/10</strong></div><div class="stat">Time<strong>${fmt(Math.min(TIME,Math.floor((Date.now()-state.startAt)/1000)))}</strong></div></div><div class="review">${rows}</div><div class="start-actions"><button class="btn" id="retry">Try again</button><button class="btn secondary" id="nextTask">Next task</button></div></div>`;$('timer').textContent='Done';$('progress').style.width='100%';$('retry').onclick=()=>{state=null;renderReady()};$('nextTask').onclick=()=>selectTask((current+1)%data.length);ads()}
document.querySelectorAll('.task').forEach((b,i)=>b.onclick=()=>selectTask(i));renderReady();ads();</script></body></html>
