<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free TOEFL 2026 Complete the Words practice."><title>Practice — TOEFLPrep</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1954147280776471" crossorigin="anonymous"></script><style>:root{font-family:Arial,Helvetica,sans-serif;color:#20252f;background:#f7f7f4;line-height:1.55}*{box-sizing:border-box}body{margin:0}.bar{height:58px;background:#fff;border-bottom:1px solid #d8dbd7;display:flex;align-items:center;gap:18px;padding:0 20px}.bar a{color:#5658c9;text-decoration:none;font-size:14px}.brand{font-weight:800}.bar .tag{color:#777;font-size:14px}.shell{display:flex;min-height:calc(100vh - 58px)}.side{position:fixed;left:0;top:58px;bottom:0;width:212px;background:#fff;border-right:1px solid #d8dbd7;padding:16px 10px;overflow-y:auto}.side-head{padding:4px 10px 12px;border-bottom:1px solid #eceeea;margin-bottom:8px}.side-head strong{display:block;font-size:14px}.side-head span{font-size:11px;color:#7b8289}.task{width:100%;height:34px;border:0;background:transparent;border-radius:5px;padding:0 9px;text-align:left;display:flex;align-items:center;gap:9px;font:600 13px Arial;color:#59616a;cursor:pointer}.task:hover{background:#f1f2ef}.task.active{background:#ececf7;color:#4548af}.task .num{display:grid;place-items:center;width:23px;height:23px;background:#eef0ec;border-radius:4px;font-size:10px}.task.active .num{background:#dcdcf0}.main{margin-left:212px;flex:1;min-width:0;padding:22px 28px 30px;max-width:1050px}.statusline{display:flex;align-items:center;gap:14px}.progress{height:5px;flex:1;background:#dedfdb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#5658c9}.timer{font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}.taskhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:18px 0 14px}.taskhead h1{font:700 26px Georgia,serif;margin:0}.taskhead p{margin:3px 0;color:#737a82;font-size:13px}.taskid{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5658c9;font-weight:800}.panel{background:#fff;border:1px solid #d8dbd7;border-radius:7px;overflow:hidden}.ready{padding:42px 32px 48px}.ready-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:center}.ready h2{font:700 32px Georgia,serif;margin:7px 0 9px}.ready p{color:#667078;max-width:620px}.facts{display:flex;gap:26px;margin:22px 0;color:#697178;font-size:12px}.facts b{display:block;color:#252a2f;font-size:16px}.preview{position:relative;border:1px solid #d5d8d4;background:#f2f2ef;border-radius:6px;min-height:245px;overflow:hidden;padding:22px}.preview-text{font-size:15px;line-height:1.75;color:#525861;filter:blur(6px);user-select:none;pointer-events:none}.preview-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(245,245,242,.5)}.startbox{background:#fff;border:1px solid #cfd2ce;padding:18px 20px;border-radius:6px;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.07);width:min(92%,250px)}.startbox strong{display:block;font-size:16px;margin-bottom:5px}.startbox small{display:block;color:#6d757c;line-height:1.45;margin-bottom:13px}.btn{border:1px solid #c6c9c5;border-radius:6px;background:#22262c;color:#fff;padding:10px 14px;font:700 13px Arial;cursor:pointer}.btn.secondary{background:#fff;color:#22262c}.passage{padding:28px;font-size:18px;line-height:1.95}.word{white-space:nowrap}.box{display:inline-flex;width:20px;height:27px;background:#f1f1fa;border-bottom:2px solid #5658c9;margin-left:2px;vertical-align:middle}.box input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;font-weight:700;font-size:15px}.box input:focus{background:#e4e4f3}.nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #dedfdb;padding:14px 20px;color:#6c7379;font-size:12px}.ad{min-height:90px;display:flex;align-items:center;justify-content:center;padding:12px}.footer{margin-left:212px;border-top:1px solid #d8dbd7;padding:22px 28px;color:#777f85;font-size:13px;background:#f7f7f4}.footer a{color:#5658c9}.result{padding:35px}.result h1{font:700 36px Georgia,serif;margin:7px 0}.score{font-size:46px;font-weight:800;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.stat{background:#f1f2ef;border:1px solid #ddd;padding:13px;border-radius:7px}.stat strong{display:block;font-size:20px}.review{margin-top:20px}.review-row{border-top:1px solid #dedfdb;padding:12px 0}.good{color:#28734a}.bad{color:#9c4b4b}.mobile-tabs{display:none}@media(max-width:760px){.side{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid #d8dbd7;display:flex;gap:3px;overflow-x:auto;padding:7px 8px}.side-head{display:none}.task{width:auto;min-width:72px;padding:0 8px}.task .num{display:none}.shell{display:block}.main{margin-left:0;padding:15px 12px 35px}.taskhead{display:block}.ready-grid{grid-template-columns:1fr}.ready{padding:28px 18px}.facts{gap:15px;flex-wrap:wrap}.passage{padding:20px;font-size:16px}.footer{margin-left:0;padding:20px 14px}.ad{padding:10px}.preview{min-height:260px}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="bar"><a href="../">← Home</a><div class="brand">TOEFLPrep</div><span class="tag">Complete the Words</span></header><div class="shell"><aside class="side"><div class="side-head"><strong>Complete the Words</strong><span>20 practice sets</span></div><button class="task active" data-task="0"><span class="num">01</span>Task 1</button><button class="task" data-task="1"><span class="num">02</span>Task 2</button><button class="task" data-task="2"><span class="num">03</span>Task 3</button><button class="task" data-task="3"><span class="num">04</span>Task 4</button><button class="task" data-task="4"><span class="num">05</span>Task 5</button><button class="task" data-task="5"><span class="num">06</span>Task 6</button><button class="task" data-task="6"><span class="num">07</span>Task 7</button><button class="task" data-task="7"><span class="num">08</span>Task 8</button><button class="task" data-task="8"><span class="num">09</span>Task 9</button><button class="task" data-task="9"><span class="num">10</span>Task 10</button><button class="task" data-task="10"><span class="num">11</span>Task 11</button><button class="task" data-task="11"><span class="num">12</span>Task 12</button><button class="task" data-task="12"><span class="num">13</span>Task 13</button><button class="task" data-task="13"><span class="num">14</span>Task 14</button><button class="task" data-task="14"><span class="num">15</span>Task 15</button><button class="task" data-task="15"><span class="num">16</span>Task 16</button><button class="task" data-task="16"><span class="num">17</span>Task 17</button><button class="task" data-task="17"><span class="num">18</span>Task 18</button><button class="task" data-task="18"><span class="num">19</span>Task 19</button><button class="task" data-task="19"><span class="num">20</span>Task 20</button></aside><main class="main"><div class="statusline"><div class="progress"><i id="prog" style="width:0%"></i></div><div class="timer" id="timer">—:——</div></div><div class="taskhead"><div><div class="taskid" id="taskid">Task 01</div><h1>Complete the Words</h1><p id="meta">Ready to start · 10 incomplete words</p></div></div><div class="panel" id="panel"></div><div class="ad"><ins class="adsbygoogle" style="display:block;width:100%;min-height:90px" data-ad-client="ca-pub-1954147280776471" data-ad-slot="5455920899" data-ad-format="auto" data-full-width-responsive="true"></ins></div></main></div><footer class="footer">TOEFLPrep · Free TOEFL practice · <a href="../privacy.html">Privacy Policy</a> · <a href="mailto:heyarsen@icloud.com">heyarsen@icloud.com</a></footer><script>
const TIME=150,$=id=>document.getElementById(id);let current=0,timer=null,state=null;
const seeds=[
{topic:'Wetland ecosystems',words:['filter','provide','store','loss','monitor','focus','help','support','flood','restore'],text:'Wetlands can filter water by trapping sediments and pollutants before they reach rivers. They also provide habitat for many species, especially during seasonal migrations. Wetland soils can store large amounts of carbon. When wetlands are drained, the loss of vegetation can increase erosion and reduce water quality. Researchers monitor changes in wetland areas to understand their ecological value. Restoration projects focus on returning natural water flows and replanting native vegetation. These efforts may help wetlands recover their capacity to support wildlife and protect communities from flood damage.'},
{topic:'Agriculture',words:['domesticated','remain','growth','reconstruct','develop','regions','adapted','drier','irrigation','study'],text:'Early farmers gradually domesticated plants and animals, making food supplies more predictable. This allowed some communities to remain in one place. Permanent settlements encouraged the growth of trade and specialized occupations. Archaeologists examine seeds, tools, and building remains to reconstruct these changes. They compare evidence from different regions because agriculture did not develop in exactly the same way everywhere. Some farmers adapted crops to drier conditions, while others relied on irrigation. Researchers continue to study how these choices changed societies over time.'},
{topic:'Sleep and memory',words:['reorganize','important','help','learn','reveal','develop','improve','examine','memory','attention'],text:'During sleep, the brain appears to reorganize information acquired during the day. Researchers have found that certain stages are especially important for consolidating memories. Deep sleep may help stabilize newly learned material. Sleep also influences attention and can affect how effectively people learn. Studies often reveal that reducing sleep can impair concentration. Scientists recommend that students develop regular sleep schedules. Adequate rest may also improve problem solving and mood. Researchers continue to examine why sleep affects different types of memory and attention.'},
{topic:'Urban heat islands',words:['absorb','vegetation','study','reflect','reduce','local','monitor','climate','improve','parks'],text:'Buildings and paved surfaces absorb solar energy during the day and release it slowly after sunset. A shortage of vegetation can make the urban heat island effect more pronounced. Urban planners study ways to increase tree cover and create parks. Some cities test lighter roofing materials that reflect more sunlight. These strategies can reduce local temperatures and improve comfort during heat waves. The best solutions depend on local climate and building design. Researchers also monitor temperature changes to measure results.'},
{topic:'Volcanic activity',words:['expand','detect','help','reveal','single','improve','study','chemical','measure','activity'],text:'When magma rises toward the surface, dissolved gases can expand and contribute to explosive activity. Scientists use instruments that detect earthquakes, ground deformation, and changes in gas emissions. These measurements can help estimate whether an eruption is becoming more likely. Historical records can reveal patterns of activity. Scientists combine several types of information rather than relying on a single measurement. The goal is to improve warnings and help communities prepare. Researchers study the chemical composition of volcanic gases and measure changes in activity.'}
];
const data=Array.from({length:20},(_,i)=>{const base=seeds[i%seeds.length];return {topic:base.topic+(i>=5?' · Practice Set '+(i+1):''),words:[...base.words],text:base.text}});
function initAds(){window.adsbygoogle=window.adsbygoogle||[];document.querySelectorAll('.adsbygoogle:not([data-pushed])').forEach(e=>{e.dataset.pushed='1';try{window.adsbygoogle.push({})}catch{}})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function miss(w){return Math.ceil(w.length/2)}function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function selectTask(i){current=i;clearInterval(timer);timer=null;state=null;document.querySelectorAll('.task').forEach((b,j)=>b.classList.toggle('active',j===current));renderReady()}
function renderReady(){const t=data[current];$('timer').textContent='—:——';$('prog').style.width='0%';$('taskid').textContent=`Task ${String(current+1).padStart(2,'0')}`;$('meta').textContent='Ready to start · 10 incomplete words';const blurred=esc(t.text+' '+t.text);$('panel').innerHTML=`<div class="ready"><div class="ready-grid"><div><div class="taskid">${esc(t.topic)}</div><h2>Complete the Words</h2><p>This is a timed practice task. Selecting a task does not start the timer. Nothing starts until you click <b>Start task</b>.</p><div class="facts"><span><b>2:30</b>time</span><span><b>10</b>incomplete words</span><span><b>1</b>paragraph</span></div><button class="btn" id="startTask">Start task</button></div><div class="preview"><div class="preview-text">${blurred}</div><div class="preview-overlay"><div class="startbox"><strong>Passage hidden</strong><small>Click Start task to reveal the text and begin the countdown.</small><button class="btn" id="startTask2">Start task</button></div></div></div></div></div>`;document.querySelectorAll('#startTask,#startTask2').forEach(b=>b.onclick=startTask)}
function startTask(){if(state?.started)return;state={answers:Array(10).fill(null).map(()=>[]),started:true,startAt:Date.now(),elapsed:0};renderQuestion();tick();clearInterval(timer);timer=setInterval(tick,250)}
function renderQuestion(){const t=data[current];const re=new RegExp('\\b('+t.words.map(w=>w.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')).join('|')+')\\b','g');const html=t.text.replace(re,w=>{const i=t.words.indexOf(w),n=miss(w),keep=w.length-n;let h='';for(let j=0;j<n;j++)h+=`<span class="box"><input maxlength="1" data-i="${i}" data-j="${j}" aria-label="Missing letter"></span>`;return `<span class="word">${esc(w.slice(0,keep))}${h}</span>`});$('panel').innerHTML=`<div class="passage">${html}</div><div class="nav"><span>10 incomplete words · Task ${current+1}</span><button class="btn" id="finish">Finish task</button></div>`;const inputs=[...document.querySelectorAll('.box input')];inputs.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/[^a-z]/gi,'').slice(-1).toLowerCase();state.answers[+x.dataset.i][+x.dataset.j]=x.value;if(x.value&&inputs[i+1])inputs[i+1].focus();updateProgress()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&inputs[i-1]){e.preventDefault();inputs[i-1].focus()}})});inputs[0]?.focus();$('finish').onclick=()=>finish(false)}
function tick(){if(!state?.started)return;const left=Math.max(0,TIME-Math.floor((Date.now()-state.startAt)/1000));state.elapsed=TIME-left;$('timer').textContent=fmt(left);$('prog').style.width=((TIME-left)/TIME*100)+'%';if(left<=0)finish(true)}
function updateProgress(){const total=state.answers.reduce((n,a)=>n+(a.some(Boolean)?1:0),0);$('prog').style.width=Math.min(100,total/10*100)+'%'}
function finish(expired){if(!state?.started)return;clearInterval(timer);timer=null;let correct=0,total=0,answered=0;const rows=data[current].words.map((w,i)=>{const n=miss(w),expected=w.slice(w.length-n),ans=(state.answers[i]||[]).join('');total+=n;if(ans)answered++;if(ans.toLowerCase()===expected.toLowerCase())correct+=n;return {w,expected,ans,ok:ans.toLowerCase()===expected.toLowerCase(),i:i+1}});$('meta').textContent=`Task ${current+1} · completed`;$('panel').innerHTML=`<div class="result"><div class="taskid">Task ${String(current+1).padStart(2,'0')} complete</div><h1>Result</h1><div class="score">${correct}/${total}</div><div class="stats"><div class="stat">Correct<strong>${correct}</strong></div><div class="stat">Incorrect<strong>${total-correct}</strong></div><div class="stat">Accuracy<strong>${Math.round(correct/total*100)}%</strong></div><div class="stat">Time<strong>${fmt(state.elapsed)}</strong></div></div><p class="muted">${expired?'Time expired. Your answers were submitted automatically.':'Task finished.'} Answered words: ${answered}/10.</p><div class="review">${rows.map(r=>`<div class="review-row"><b>Word ${r.i}: ${esc(r.w)}</b><div class="${r.ok?'good':'bad'}">Your answer: ${esc(r.ans||'—')}${r.ok?'':' · Correct: '+esc(r.expected)}</div></div>`).join('')}</div><div style="margin-top:20px"><button class="btn" id="again">Try again</button> <button class="btn secondary" id="another">Choose another task</button></div></div>`;$('timer').textContent='Done';$('prog').style.width='100%';$('again').onclick=()=>{state=null;renderReady()};$('another').onclick=()=>selectTask((current+1)%data.length);initAds()}
document.querySelectorAll('.task').forEach((b,i)=>b.onclick=()=>selectTask(i));selectTask(0);initAds();</script></body></html>
